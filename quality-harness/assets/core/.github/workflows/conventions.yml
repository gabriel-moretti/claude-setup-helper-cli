name: "🧭 Convenções"

# 🌳 Conventional Branch · 😜 gitmoji · 🎯 destino do PR · 🙅 sem atribuição de IA em commits/branches
# 📐 standards: código em inglês, arquivos de IA em inglês, políticas de .github/standards.json
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main, test, sandbox]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: conventions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conventions:
    name: conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const run = require('./.github/scripts/conventions.js');
            await run({ github, context, core });

  # 📐 Código em inglês · arquivos de IA em inglês · políticas de idioma, hospedagem, IaC e ORM
  standards:
    name: standards
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.base_ref }}
        run: node .github/scripts/standards.js --base "$BASE"
