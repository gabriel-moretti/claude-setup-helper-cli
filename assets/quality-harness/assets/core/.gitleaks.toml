title = "Harness DeltaPag — gitleaks"

# Mantém todas as regras padrão do gitleaks e acrescenta as da casa.
[extend]
useDefault = true

[[rules]]
id = "connection-string-with-password"
description = "URL de conexão com usuário e senha embutidos"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|redis|amqps?|mssql|sqlserver)://[^:\s/@]+:[^@\s/]{3,}@[^\s'"]+'''
keywords = ["://"]

[[rules]]
id = "private-key-block"
description = "Bloco PEM de chave privada"
regex = '''-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----'''
keywords = ["private key"]

[allowlist]
description = "Exceções globais — documente o motivo de cada entrada"
paths = [
  '''(?i)(^|/)(uv|pnpm-lock|pubspec)\.(lock|yaml)$''',
  '''(?i)\.env\.example$''',
]
regexes = [
  # Placeholders usados em exemplos e docs
  '''://(?:user|usuario|username):(?:pass|senha|password|changeme)@''',
  # Bancos efêmeros locais/CI (service containers): host localhost ou 127.0.0.1 apenas
  '''://[^:\s/@]+:[^@\s/]+@(?:localhost|127\.0\.0\.1)(?::\d+)?/''',
]
