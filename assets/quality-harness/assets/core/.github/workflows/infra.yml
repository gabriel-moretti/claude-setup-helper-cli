name: "🏗️ Infra"

# Terraform (infra/**/*.tf) ou AWS CDK (infra/cdk.json): formatação, validação, scan de segurança (Checkov)
# e plano com credenciais temporárias via OIDC — nada de chave de acesso fixa em segredo.
# ⏱️ Só roda quando algo em infra/ muda.
on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**"]

permissions:
  contents: read
  id-token: write   # OIDC → AWS / Azure

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  iac:
    name: "🏗️ IaC"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: kind
        run: |
          if [ -f cdk.json ]; then echo "kind=cdk" >> "$GITHUB_OUTPUT";
          elif ls **/*.tf *.tf >/dev/null 2>&1 || find . -name '*.tf' | grep -q .; then echo "kind=terraform" >> "$GITHUB_OUTPUT";
          else echo "kind=none" >> "$GITHUB_OUTPUT"; echo "::notice::infra/ sem Terraform nem CDK"; fi

      # ── credenciais temporárias (opcional): vars.AWS_ROLE_ARN ou vars.AZURE_CLIENT_ID/TENANT_ID/SUBSCRIPTION_ID
      - if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}
      - if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ── Terraform
      - if: steps.kind.outputs.kind == 'terraform'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - if: steps.kind.outputs.kind == 'terraform'
        name: "🎨 terraform fmt"
        run: terraform fmt -check -recursive
      - if: steps.kind.outputs.kind == 'terraform'
        name: "🔍️ terraform validate"
        run: |
          for d in $(find . -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
            echo "::group::$d"; (cd "$d" && terraform init -backend=false -input=false >/dev/null && terraform validate); echo "::endgroup::"
          done
      # terraform module (references/devops/terraform.md): only when its files exist
      - if: steps.kind.outputs.kind == 'terraform' && hashFiles('infra/.tflint.hcl') != ''
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
      - if: steps.kind.outputs.kind == 'terraform' && hashFiles('infra/.tflint.hcl') != ''
        name: "🚨 tflint"
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl"
      - if: steps.kind.outputs.kind == 'terraform' && hashFiles('infra/modules/*/tests/*.tftest.hcl') != ''
        name: "🧪 terraform test"
        run: |
          for d in modules/*/; do
            [ -d "$d/tests" ] || continue
            echo "▶ $d"; (cd "$d" && terraform init -backend=false -input=false >/dev/null && terraform test)
          done
      - if: steps.kind.outputs.kind == 'terraform' && (vars.AWS_ROLE_ARN != '' || vars.AZURE_CLIENT_ID != '') && vars.TF_ROOT != ''
        name: "📋 terraform plan"
        working-directory: ${{ vars.TF_ROOT }}
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -lock=false | tee plan.txt
          { echo '### 📋 terraform plan'; echo '```'; tail -n 60 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # ── AWS CDK
      - if: steps.kind.outputs.kind == 'cdk'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
      - if: steps.kind.outputs.kind == 'cdk'
        name: "🏗️ cdk synth"
        run: |
          npm ci
          npx cdk synth --quiet
      - if: steps.kind.outputs.kind == 'cdk' && vars.AWS_ROLE_ARN != ''
        name: "📋 cdk diff"
        run: npx cdk diff --no-color 2>&1 | tee diff.txt; { echo '### 📋 cdk diff'; echo '```'; tail -n 60 diff.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # ── 🔒️ scan de segurança da infraestrutura
      - if: steps.kind.outputs.kind != 'none'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - if: steps.kind.outputs.kind != 'none'
        name: "🔒️ Checkov"
        run: |
          pip install --quiet checkov
          if [ "${{ steps.kind.outputs.kind }}" = cdk ]; then checkov -d cdk.out --framework cloudformation --compact --quiet;
          else checkov -d . --framework terraform --compact --quiet; fi
