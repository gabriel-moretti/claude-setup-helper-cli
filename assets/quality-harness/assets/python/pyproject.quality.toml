# Mesclar no pyproject.toml do projeto.
# Ajuste target-version / python_version para o mínimo de `requires-python`.

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-cov",
  "lefthook",
]

# ── Ruff ────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/**", "**/generated/**"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle + pyflakes
  "I",             # imports (substitui isort)
  "UP",            # sintaxe moderna
  "B",             # bugbear
  "S",             # segurança (bandit)
  "SIM", "C4", "RET", "PTH",
  "N",             # nomenclatura
  "C90",           # complexidade ciclomática
  "PL",            # pylint
  "T20",           # sem print()
  "DTZ",           # datetime sem timezone
  "ERA",           # código comentado
  "RUF",
]
ignore = [
  "PLR0913",       # muitos argumentos — revise caso a caso em vez de bloquear
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ── mypy ────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["migrations/", "generated/"]

# RETROFIT: relaxe módulos legados um a um e remova da lista conforme tipar.
# [[tool.mypy.overrides]]
# module = ["app.legado.*"]
# ignore_errors = true

# ── pytest / coverage ───────────────────────────────────────────────────
[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = ["slow: testes lentos, fora do pre-push"]

[tool.coverage.run]
branch = true
source = ["src"]   # ajuste para o pacote do projeto

[tool.coverage.report]
# Sem fail_under: o gate único é .github/scripts/coverage.cjs no CI (75% / 85% em main).
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
]
