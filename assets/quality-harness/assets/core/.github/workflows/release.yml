name: "🔖 Release"

# main            → tag vX.Y.Z (anotada, imutável) + GitHub Release com a seção do CHANGELOG + deploy production
# release/vX.Y.Z  → tag vX.Y.Z-rc.N + pré-release + deploy em test (ou sandbox)
# vars.MOVING_TAGS=true → mantém também vX e vX.Y apontando para a última estável (libs e actions)
on:
  push:
    branches: [main, "release/**"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: "🏷️ Tag e release"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      created: ${{ steps.create.outputs.created }}
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
      environment: ${{ steps.info.outputs.environment }}
      trunks: ${{ steps.info.outputs.trunks }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: info
        run: node .github/scripts/release.cjs info --ref "${GITHUB_REF_NAME}" | tee -a "$GITHUB_OUTPUT"
      - id: create
        if: steps.info.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
          VERSION: ${{ steps.info.outputs.version }}
          PRERELEASE: ${{ steps.info.outputs.prerelease }}
        run: |
          node .github/scripts/release.cjs notes "$VERSION" > notes.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -F notes.md
          git push origin "$TAG"
          flags=(--verify-tag --title "$TAG" --notes-file notes.md)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease --latest=false); else flags+=(--latest); fi
          gh release create "$TAG" "${flags[@]}"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "### 🔖 $TAG publicada" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.create.outputs.created == 'true' && steps.info.outputs.prerelease == 'false' && vars.MOVING_TAGS == 'true'
        env:
          MAJOR: ${{ steps.info.outputs.major_tag }}
          MINOR: ${{ steps.info.outputs.minor_tag }}
        run: |
          git tag -f "$MAJOR" && git tag -f "$MINOR"
          git push -f origin "$MAJOR" "$MINOR"

  deploy:
    name: "🚀 Deploy"
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ needs.tag.outputs.environment }}
      ref: ${{ needs.tag.outputs.tag }}
    secrets: inherit

  back-merge:
    name: "🔀 Back-merge"
    needs: tag
    if: github.ref_name == 'main' && needs.tag.outputs.created == 'true' && needs.tag.outputs.trunks != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # PR aberto com GITHUB_TOKEN não dispara workflows. Com um GitHub App (vars.RELEASE_APP_ID +
      # secrets.RELEASE_APP_KEY) os checks rodam normalmente no PR de back-merge.
      - id: app
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
          TRUNKS: ${{ needs.tag.outputs.trunks }}
        run: |
          for base in $TRUNKS; do
            if [ -n "$(gh pr list -R "$GITHUB_REPOSITORY" --base "$base" --head main --state open --json number -q '.[].number')" ]; then
              echo "ℹ️ já existe back-merge aberto para $base"; continue; fi
            gh pr create -R "$GITHUB_REPOSITORY" --base "$base" --head main \
              --title "🔀 Merge main into $base ($TAG)" \
              --body "<!-- pr-template:other -->
          Sincroniza \`$base\` com a produção após **$TAG**. Use **merge commit** (não squash)."
          done
