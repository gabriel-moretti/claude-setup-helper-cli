name: "🔖 Release check"

# Roda em todo PR para main (check estável para exigir), mas só valida release/* e hotfix/*:
# SemVer · bump compatível com os gitmojis · CHANGELOG (Common Changelog) · README atualizado
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: node .github/scripts/release.cjs check --head "$HEAD_REF" --base "$BASE_REF"
