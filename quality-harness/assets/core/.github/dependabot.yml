# ⬆️ Dependabot no padrão do repositório:
#   título/commit "⬆️ Bump x from 1 to 2" (gitmoji válido) · branch dependabot/… (exceção aceita pela convenção)
#   Com a branch `test` ativa, descomente target-branch para os PRs passarem por test antes de produção.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "⬆️" }
    groups: { actions: { patterns: ["*"] } }
    # target-branch: test

  # Blocos por stack: acrescente aqui o conteúdo de assets/<stack>/dependabot.<stack>.yml da skill.
